<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b5d57"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Éditeur PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#e9edf4;--surf:#fff;--glass:rgba(255,255,255,.82);--ink:#0f172a;--mute:#64748b;--line:#dbe2ec;--acc:#2447f9;--acc-ink:#fff;--hl:#ffe14d;--hl-ink:#3b2f00;--hint:rgba(36,71,249,.09);--hintline:rgba(36,71,249,.35);--sel:rgba(36,71,249,.2);--danger:#d92d20;--shadow:0 10px 30px -12px rgba(15,23,42,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--surf:#161b26;--glass:rgba(22,27,38,.84);--ink:#e8edf6;--mute:#93a0b5;--line:#283042;--acc:#7c9bff;--acc-ink:#0b1020;--hl:#ffe14d;--hl-ink:#2b2200;--hint:rgba(124,155,255,.11);--hintline:rgba(124,155,255,.45);--sel:rgba(124,155,255,.26);--danger:#ff7a70;--shadow:0 10px 30px -12px rgba(0,0,0,.75)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI Variable",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:auto;touch-action:pan-x pan-y;padding-bottom:190px}
button,.btn,.tool{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{margin-right:auto;display:flex;gap:9px;align-items:center;font-weight:700;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--ink);position:relative}
.mark::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:7px;border-radius:2px;background:var(--hl)}
.ib{width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:transparent}
.ib:active{background:var(--hint)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);font-weight:600}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.big{height:48px;padding:0 22px;font-size:1rem}
#empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:56px 24px;max-width:420px;margin:auto}
#empty h2{margin:10px 0 0;font-size:1.4rem;letter-spacing:-.02em}
#empty p{margin:0 0 10px;color:var(--mute)}
#stage{position:relative;margin:16px auto 0;width:max-content}
canvas{display:block}
#cv{background:#fff;border-radius:3px;box-shadow:var(--shadow)}
#layer{position:absolute;left:0;top:0}
#pc{position:absolute;left:0;top:0;pointer-events:none;touch-action:none;background:transparent;box-shadow:none}
.t{position:absolute;cursor:pointer;border-radius:3px;box-shadow:inset 0 -2px 0 var(--hintline)}
.t:hover{background:var(--hint)}
.ob{position:absolute;touch-action:none;cursor:grab}
.ob.sel{outline:2px solid var(--acc);outline-offset:1px}
.guide{position:absolute;background:var(--acc);opacity:.75;pointer-events:none;z-index:3}
.gh{left:0;right:0;height:1px}.gv{top:0;bottom:0;width:1px}
#cleanx{display:none;position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:36px;height:36px;border-radius:50%;border:0;background:rgba(15,23,42,.35);color:#fff;z-index:50;place-items:center}
body.clean #cleanx{display:grid}
body.clean .top,body.clean #dockwrap,body.clean #panel,body.clean #msg{display:none!important}
body.clean .t,body.clean .ob.sel{box-shadow:none;outline:none}
.t.on{background:var(--sel);box-shadow:none;outline:2px solid var(--acc)}
#dockwrap{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
#dockwrap>*{pointer-events:auto}
body:not(.ready) #dockwrap{display:none}
#nav,#opts,#dock{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
#nav{display:none;align-items:center;gap:2px;padding:4px;border-radius:999px}
#nav button{width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:transparent}
#nav button:active{background:var(--hint)}
#pg,#zv{min-width:58px;text-align:center;font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums}
.vr{width:1px;height:20px;background:var(--line);margin:0 4px}
#opts{display:none;align-items:center;gap:14px;padding:8px 16px;border-radius:22px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 8px);font-size:.84rem;color:var(--mute)}
body[data-mode=hl] #opts,body[data-mode=pen] #opts,body[data-mode=erase] #opts,body[data-mode=box] #opts,body[data-mode=ctr] #opts{display:flex}
.o{display:none;align-items:center;gap:10px}
body[data-mode=hl] .o-hl,body[data-mode=pen] .o-pen,body[data-mode=erase] .o-er,body[data-mode=box] .o-box,body[data-mode=ctr] .o-box,body[data-mode=ctr] .o-ctr{display:flex}
#shape,#wscope{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit;font-size:.85rem;padding:0 8px}
input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;overflow:hidden;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=range]{accent-color:var(--acc);width:130px}
#dock{display:flex;gap:2px;max-width:100%;overflow-x:auto;padding:6px;border-radius:22px;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 6px;border:0;border-radius:14px;background:transparent;font-size:.68rem;font-weight:600}
.tool:active{transform:scale(.96)}
.tool.main{background:var(--hl);color:var(--hl-ink)}
.tool.danger{color:var(--danger)}
.sep{flex:0 0 1px;background:var(--line);margin:6px 4px}
#cbar,#ibar,#zbar{display:flex;max-width:calc(100% - 8px);overflow-x:auto;gap:2px;padding:4px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
#cbar button,#ibar button,#zbar button{flex:0 0 auto;height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-weight:600}
#cbar button:active,#ibar button:active,#zbar button:active{background:var(--hint)}
#c-keep{background:var(--acc)!important;color:var(--acc-ink)!important}
#c-er,#i-del,#z-er{color:var(--danger)}
#zbar span{align-self:center;padding:0 10px;font-size:.84rem;color:var(--mute);white-space:nowrap}
#zc{position:absolute;left:0;top:0;pointer-events:none;background:transparent;box-shadow:none}
body[data-mode=mag] #opts{display:flex}body[data-mode=mag] .o-mag{display:flex}body[data-mode=word] #opts{display:flex}body[data-mode=word] .o-word{display:flex}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;max-height:72vh;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px -12px rgba(15,23,42,.45);padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
#panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#panel .in{max-width:620px;margin:auto;display:grid;gap:10px}
#info{color:var(--mute);font-size:.86rem}
#panel input:not([type]),#panel input[type=number],#panel select{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
#panel .row{display:flex;gap:8px;align-items:center}
#panel .row>*{flex:1;min-width:0}
#sz{flex:0 0 84px!important}
#col{flex:0 0 46px!important;width:46px;height:46px}
.btn2{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);font-weight:600}
.btn2.main{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:40;max-width:90%;font-size:.92rem}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>

<header class="top">
  <div class="brand"><span class="mark"></span>Éditeur PDF<small style="font-weight:500;color:var(--mute);font-size:.7rem">v27 · polices + effacement précis</small></div>
  <button id="undo" class="ib" disabled aria-label="Annuler"><svg class="i"><use href="#i-undo"/></svg></button>
  <button id="redo" class="ib" disabled aria-label="Rétablir"><svg class="i"><use href="#i-redo"/></svg></button>
  <button id="clean" class="ib" aria-label="Aperçu propre : masque tous les repères"><svg class="i"><use href="#i-eye"/></svg></button>
  <button id="save" class="ib" disabled aria-label="Télécharger le PDF"><svg class="i"><use href="#i-dl"/></svg></button>
  <label class="btn main"><svg class="i"><use href="#i-open"/></svg><span>Ouvrir</span><input id="file" type="file" accept="application/pdf" hidden></label>
</header>
<section id="empty">
  <svg width="120" height="150" viewBox="0 0 120 150" aria-hidden="true"><rect x="6" y="6" width="108" height="138" rx="10" fill="var(--surf)" stroke="var(--line)" stroke-width="2"/><rect x="22" y="42" width="62" height="12" rx="3" fill="var(--hl)"/><g stroke="var(--mute)" stroke-width="5" stroke-linecap="round" opacity=".55"><path d="M22 26h50M22 48h76M22 70h66M22 92h76M22 114h44"/></g></svg>
  <h2>Ouvrez un cours en PDF</h2>
  <p>Surlignez, écrivez, dessinez, effacez et réorganisez les pages. Tout reste sur votre téléphone.</p>
  <button id="openbig" class="btn main big">Ouvrir un PDF</button>
</section>
<div id="stage" hidden><canvas id="cv"></canvas><div id="layer"></div><canvas id="zc"></canvas><canvas id="pc"></canvas></div>
<div id="dockwrap">
  <div id="zbar" hidden><span>Sélection active</span><button id="z-mv">Déplacer</button><button id="z-er">Effacer la sélection</button><button id="z-no">Désélectionner</button></div>
  <div id="cbar" hidden><button id="c-er">Effacer</button><button id="c-hl">Surligner</button><button id="c-mv">Déplacer</button><button id="c-cp">Copier</button><button id="c-ct">Couper</button><button id="c-keep">Tracer le contour</button><button id="c-no">Annuler</button></div>
  <div id="ibar" hidden><button id="i-l" aria-label="Décaler à gauche">◀</button><button id="i-u" aria-label="Décaler vers le haut">▲</button><button id="i-d" aria-label="Décaler vers le bas">▼</button><button id="i-r" aria-label="Décaler à droite">▶</button><button id="i-min" aria-label="Réduire">−</button><button id="i-pls" aria-label="Agrandir">+</button><button id="i-ed">Modifier</button><button id="i-nb">Sans fond</button><button id="i-del">Supprimer</button><button id="i-ok">OK</button></div>
  <div id="opts">
    <div class="o o-hl"><span>Surligneur</span><input id="hlc" type="color" value="#ffe600" aria-label="Couleur du surligneur"></div>
    <div class="o o-pen"><span>Stylo</span><input id="penc" type="color" value="#d92d20" aria-label="Couleur du stylo"></div>
    <div class="o o-ctr"><span>Forme</span><select id="shape" aria-label="Forme du contour"><option value="free">Libre</option><option value="rect">Rectangle</option><option value="round">Rectangle arrondi</option><option value="ellipse">Ovale</option><option value="diamond">Losange</option><option value="triangle">Triangle</option><option value="star">Étoile</option><option value="arrow">Flèche</option></select></div>
    <div class="o o-box"><span>Cadre</span><input id="boxc" type="color" value="#2447f9" aria-label="Couleur du cadre"><input id="boxw" type="range" min="1" max="6" step="0.5" value="2" aria-label="Épaisseur du cadre"></div>
    <div class="o o-word"><span>Portée</span><select id="wscope" aria-label="Portée de la sélection"><option value="word">Un mot</option><option value="phrase">Groupe de mots</option></select></div>
    <div class="o o-mag"><span>Tolérance</span><input id="mtol" type="range" min="15" max="140" value="60" aria-label="Tolérance de couleur"><label style="display:flex;align-items:center;gap:6px"><input id="mline" type="checkbox" checked>Ignorer les traits</label></div>
    <div class="o o-er"><span>Taille</span><input id="brs" type="range" min="4" max="60" value="14" aria-label="Taille de la gomme"><label style="display:flex;align-items:center;gap:6px"><input id="real" type="checkbox" checked>Suppression réelle</label></div>
  </div>
  <div id="nav">
    <button id="prev" aria-label="Page précédente"><svg class="i"><use href="#i-l"/></svg></button><span id="pg"></span><button id="next" aria-label="Page suivante"><svg class="i"><use href="#i-r"/></svg></button>
    <span class="vr"></span>
    <button id="zout" aria-label="Dézoomer"><svg class="i"><use href="#i-minus"/></svg></button><span id="zv">100 %</span><button id="zin" aria-label="Zoomer"><svg class="i"><use href="#i-plus"/></svg></button>
  </div>
  <div id="dock">
    <button class="tool" id="addt"><svg class="i"><use href="#i-text"/></svg><span>Texte</span></button>
    <button class="tool" id="hl"><svg class="i"><use href="#i-hl"/></svg><span>Surligner</span></button>
    <button class="tool" id="pen"><svg class="i"><use href="#i-pen"/></svg><span>Stylo</span></button>
    <button class="tool" id="box"><svg class="i"><use href="#i-box"/></svg><span>Cadre</span></button>
    <button class="tool" id="ctr"><svg class="i"><use href="#i-ctr"/></svg><span>Contour</span></button>
    <button class="tool" id="wsel"><svg class="i"><use href="#i-wsel"/></svg><span>Mots</span></button>
    <button class="tool" id="mag"><svg class="i"><use href="#i-wand"/></svg><span>Baguette</span></button>
    <button class="tool" id="paste" disabled><svg class="i"><use href="#i-paste"/></svg><span>Coller</span></button>
    <button class="tool" id="er"><svg class="i"><use href="#i-er"/></svg><span>Gomme</span></button>
    <label class="tool"><svg class="i"><use href="#i-img"/></svg><span>Image</span><input id="ifile" type="file" accept="image/*" hidden></label>
    <span class="sep"></span>
    <button class="tool" id="rot"><svg class="i"><use href="#i-rot"/></svg><span>Pivoter</span></button>
    <button class="tool" id="mvl" aria-label="Déplacer la page vers le début"><svg class="i"><use href="#i-l"/></svg><span>Reculer</span></button>
    <button class="tool" id="mvr" aria-label="Déplacer la page vers la fin"><svg class="i"><use href="#i-r"/></svg><span>Avancer</span></button>
    <button class="tool" id="blank"><svg class="i"><use href="#i-blank"/></svg><span>Page vierge</span></button>
    <label class="tool"><svg class="i"><use href="#i-merge"/></svg><span>Fusionner</span><input id="mfile" type="file" accept="application/pdf" hidden></label>
    <button class="tool danger" id="del"><svg class="i"><use href="#i-del"/></svg><span>Supprimer</span></button>
  </div>
</div>
<div id="panel"><div class="in">
  <div id="info"></div>
  <input id="txt" autocomplete="off" aria-label="Nouveau texte">
  <div class="row"><select id="fnt" aria-label="Police"></select><input id="sz" type="number" min="4" max="200" step="0.5" aria-label="Taille du texte"><input id="col" type="color" aria-label="Couleur du texte"></div>
  <div class="row"><button id="more" class="btn2">Ligne suivante</button><label class="btn2">Mes polices<input id="ffile" type="file" accept=".ttf,.otf" multiple hidden></label></div>
  <div class="row"><button id="cancel" class="btn2">Fermer</button><button id="delobj" class="btn2" hidden style="color:var(--danger)">Supprimer</button><button id="apply" class="btn2 main">Appliquer</button></div>
</div></div>
<div id="msg" role="status"></div>
<button id="cleanx" aria-label="Quitter l’aperçu propre"><svg class="i"><use href="#i-eye"/></svg></button>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const MAX_HISTORY=30;   // chaque étape garde un PDF complet : au-delà, la mémoire du téléphone sature

// Un seul rendu à la fois : un nouveau rendu annule le précédent (sinon pdf.js plante sur le même canvas).
let rTask=null,oTask=null,rId=0,noTextWarned=false;
async function render(){
  const id=++rId;
  closePanel();
  const page=await doc.getPage(pageNo);
  if(id!==rId)return;
  const w=Math.min(window.innerWidth-16,900)*zoom;
  const vb=page.getViewport({scale:1});
  scale=w/vb.width;
  const vp=page.getViewport({scale});
  // Safari (iPhone) affiche une page blanche au-delà d'environ 16,7 millions de pixels : on plafonne aussi la surface
  const dpr=Math.min(window.devicePixelRatio||1,2,4096/vp.width,4096/vp.height,Math.sqrt(16e6/(vp.width*vp.height)));
  if(rTask){try{rTask.cancel()}catch(e){}rTask=null}
  if(oTask){try{oTask.cancel()}catch(e){}oTask=null}
  curVp=vp;{const pc=$('pc');pc.width=vp.width;pc.height=vp.height;pc.style.width=vp.width+'px';pc.style.height=vp.height+'px';const z=$('zc');z.width=vp.width;z.height=vp.height;z.style.width=vp.width+'px';z.style.height=vp.height+'px'}cv.width=vp.width*dpr;cv.height=vp.height*dpr;
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  rTask=page.render({canvasContext:ctx,viewport:vp,transform:[dpr,0,0,dpr,0,0]});
  try{await rTask.promise}catch(e){return}
  if(id!==rId)return;
  ocv.width=cv.width;ocv.height=cv.height;
  if(odoc){
    const op=await odoc.getPage(pageNo);if(id!==rId)return;
    oTask=op.render({canvasContext:octx,viewport:vp,transform:[dpr,0,0,dpr,0,0],background:'rgba(0,0,0,0)'});
    try{await oTask.promise}catch(e){return}
    if(id!==rId)return;
  }
  $('pg').textContent='Page '+pageNo+' / '+doc.numPages;
  $('prev').disabled=pageNo<=1;$('next').disabled=pageNo>=doc.numPages;
  const tc=await page.getTextContent();if(id!==rId)return;
  const ls=await buildLines(page,tc,vp,dpr);if(id!==rId)return;
  lines=ls;
  const L=$('layer');L.innerHTML='';L.style.width=vp.width+'px';L.style.height=vp.height+'px';
  if(!lines.length&&!noTextWarned){noTextWarned=true;toast('Aucun texte sélectionnable sur cette page : le PDF est probablement un scan ou une image.')}
  lines.forEach(l=>{
    const d=document.createElement('div');d.className='t';
    d.style.cssText=`left:${l.cx}px;top:${l.cy}px;width:${l.cw}px;height:${l.ch}px`;
    d.onclick=()=>{if(addMode||pendingImg||pendingPaste)return;if(mode==='hl')run(()=>highlight(l));else if(!mode)choose(l,d)};L.appendChild(d);l.el=d;
  });
  drawObjOverlays(L,vp);
  if(zmeta&&(zmeta.page!==pageNo||Math.abs(zmeta.scale-scale)>1e-6))clearSel();else drawZone();
}

const STD={Helvetica:['Helvetica','HelveticaBold','HelveticaOblique','HelveticaBoldOblique'],Times:['TimesRoman','TimesRomanBold','TimesRomanItalic','TimesRomanBoldItalic'],Courier:['Courier','CourierBold','CourierOblique','CourierBoldOblique']};
const FAMLABEL={Helvetica:'Sans-serif',Times:'Serif',Courier:'Machine à écrire'};
function pickFont(name,family){
  const n=(name||'').toLowerCase().replace(/^[a-z]{6}\+/,'');
  let f=null;
  if(/courier|mono|consolas|typewriter|lucidaconsole/.test(n)||family==='monospace')f='Courier';
  else if(/arial|helvet|calibri|verdana|tahoma|segoe|roboto|opensans|lato|sans|gothic|futura|trebuchet|myriad|frutiger/.test(n))f='Helvetica';
  else if(/times|serif|georgia|garamond|minion|cambria|palatino|book|baskerville|didot|caslon|cmr|libertin/.test(n))f='Times';
  const known=!!f;
  if(!f)f=family==='serif'?'Times':'Helvetica';
  const bold=/bold|black|heavy|semibold|demi|-bd/.test(n),ital=/italic|oblique|-it$|-it\b/.test(n);
  const key=STD[f][(bold?1:0)+(ital?2:0)];
  return{std:PDFLib.StandardFonts[key],key,bold,ital,known,fam:f,label:FAMLABEL[f]+(bold?' gras':'')+(ital?' italique':'')};
}
// Si le nom de la police est inconnu, on choisit la famille dont la largeur colle le mieux à l'original.
let mdoc=null;const mcache={};
async function stdWidth(key,text,size){
  try{
    if(!mdoc)mdoc=await PDFLib.PDFDocument.create();
    if(!mcache[key])mcache[key]=await mdoc.embedFont(PDFLib.StandardFonts[key]);
    return mcache[key].widthOfTextAtSize(text,size);
  }catch(e){return null}
}
async function bestByWidth(f,l){
  let best=f,bw=1e9;
  for(const g of['Helvetica','Times','Courier']){
    const k=STD[g][(f.bold?1:0)+(f.ital?2:0)],w=await stdWidth(k,l.s,l.size);
    if(w==null)continue;
    const e=Math.abs(w-l.w)/l.w;
    if(e<bw){bw=e;best={...f,fam:g,key:k,std:PDFLib.StandardFonts[k],label:FAMLABEL[g]+(f.bold?' gras':'')+(f.ital?' italique':'')}}
  }
  return best;
}
// Polices courantes disponibles en ligne : on reprend la vraie police (ou son équivalent exact) au lieu d'une police proche.
const WEB=[[/^georgia/,'gelasio','Gelasio, équivalent de Georgia'],[/^(eb)?garamond/,'eb-garamond','EB Garamond'],[/^comicsans/,'comic-neue','Comic Neue, proche de Comic Sans'],[/^futura/,'jost','Jost, proche de Futura'],[/^impact/,'anton','Anton, proche d’Impact'],[/^couriernew/,'courier-prime','Courier Prime, proche de Courier New'],[/^calibri/,'carlito','Carlito, équivalent exact de Calibri'],[/^cambria(?!math)/,'caladea','Caladea, équivalent exact de Cambria'],[/^roboto(?!mono|slab|condensed)/,'roboto','Roboto'],[/^opensans/,'open-sans','Open Sans'],[/^lato/,'lato','Lato'],[/^montserrat/,'montserrat','Montserrat'],[/^poppins/,'poppins','Poppins'],[/^sourcesans/,'source-sans-3','Source Sans'],[/^merriweather/,'merriweather','Merriweather'],[/^playfairdisplay/,'playfair-display','Playfair Display'],[/^ptserif/,'pt-serif','PT Serif'],[/^raleway/,'raleway','Raleway'],[/^nunito/,'nunito','Nunito'],[/^ubuntu(?!mono)/,'ubuntu','Ubuntu'],[/^inter(regular|bold|medium|semibold|light|italic|$)/,'inter','Inter']];
const WEBALT={'courier-prime':[['cousine','Cousine (mêmes largeurs, sans empattement)'],['cutive-mono','Cutive Mono (machine à écrire fine)']]};
function webFamily(name){
  const n=(name||'').toLowerCase().replace(/^[a-z]{6}\+/,'').replace(/[^a-z0-9]/g,'');
  for(const[re,id,label]of WEB)if(re.test(n))return{id,label};
  return null;
}
const wcache={};
async function webFontBytes(web,bold,ital){
  const w=bold?700:400;
  for(const[wt,it]of[[w,ital],[w,false],[400,false]]){
    const url='https://cdn.jsdelivr.net/npm/@fontsource/'+web.id+'/files/'+web.id+'-latin-'+wt+'-'+(it?'italic':'normal')+'.woff';
    if(wcache[url])return wcache[url];
    try{const r=await fetch(url);if(!r.ok)continue;return wcache[url]=new Uint8Array(await r.arrayBuffer())}catch(e){}
  }
  return null;
}

async function buildLines(page,tc,vp,dpr){
  const items=tc.items.filter(i=>i.str&&i.str.trim()&&Math.abs(i.transform[1])<0.01)
    .map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,size:Math.hypot(i.transform[0],i.transform[1]),fn:i.fontName}));
  items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
  const out=[];
  for(const it of items){
    const p=out[out.length-1];
    if(p&&p.fn===it.fn&&Math.abs(p.y-it.y)<2&&it.x-(p.x+p.w)<p.size*0.6&&it.x>=p.x){
      const gap=it.x-(p.x+p.w);
      p.s+=(gap>p.size*0.15?' ':'')+it.s;p.w=it.x+it.w-p.x;
    }else out.push({...it});
  }
  for(const l of out){
    let real=l.fn;
    try{real=page.commonObjs.get(l.fn).name||l.fn}catch(e){}
    const fam=(tc.styles[l.fn]||{}).fontFamily;
    let f=pickFont(real,fam);
    if(!f.known&&l.s.length>3)f=await bestByWidth(f,l);
    l.std=f.std;l.key=f.key;l.fontLabel=f.label;l.bold=f.bold;l.ital=f.ital;l.real=(real||'').replace(/^[A-Z]{6}\+/,'');l.web=webFamily(real);
    const [px,py]=vp.convertToViewportPoint(l.x,l.y);
    l.cx=px;l.cy=py-l.size*scale*0.92;l.cw=l.w*scale;l.ch=l.size*scale*1.25;
    const col=sampleColors(px,py,l,dpr);l.color=col.fg;l.bg=col.bg;
  }
  return out;
}

function sampleColors(px,py,l,dpr){
  try{
    const x=Math.max(0,Math.floor(px*dpr)),y=Math.max(0,Math.floor((py-l.size*scale)*dpr));
    const w=Math.max(1,Math.floor(l.w*scale*dpr)),h=Math.max(1,Math.floor(l.size*scale*1.2*dpr));
    const d=ctx.getImageData(x,y,Math.min(w,cv.width-x),Math.min(h,cv.height-y)).data;
    let dark=[0,0,0],dl=999,light=[255,255,255],ll=-1;
    for(let i=0;i<d.length;i+=4){
      const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];
      if(lum<dl){dl=lum;dark=[d[i],d[i+1],d[i+2]]}
      if(lum>ll){ll=lum;light=[d[i],d[i+1],d[i+2]]}
    }
    // texte clair sur fond sombre : on inverse les rôles
    const px0=ctx.getImageData(Math.max(0,x-2),Math.max(0,y+Math.floor(h/2)),1,1).data;
    const edge=.299*px0[0]+.587*px0[1]+.114*px0[2];
    if(edge<128)return{fg:light,bg:[px0[0],px0[1],px0[2]]};
    return{fg:dark,bg:[px0[0],px0[1],px0[2]]};
  }catch(e){return{fg:[0,0,0],bg:[255,255,255]}}
}

function syncWebOption(){

// Pour une police absente de la liste : on devine son nom en ligne et on vérifie qu'elle existe.
function guessId(name){
  let n=(name||'').replace(/^[A-Z]{6}\+/,'').split(/[-,]/)[0].replace(/(PSMT|MT|PS)$/,'');
  n=n.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(n.length<3||/^(g-d|f\d|arial|helvetica|times|courier|symbol|wingdings|zapfdingbats|calibri|cambria)/.test(n))return null;
  return n;
}
const wmiss={};
async function probeWeb(l){
  if(l.web||l.probed||!l.real)return;
  l.probed=true;
  const id=guessId(l.real);
  if(!id||wmiss[id])return;
  const b=await webFontBytes({id},false,false);
  if(!b){wmiss[id]=1;return}
  l.web={id,label:l.real.replace(/^[A-Z]{6}\+/,'')+' (trouvée en ligne)'};
  if(sel===l){syncWebOption();$('fnt').value='web';setInfo();autoPick()}
}
// Mémoire des choix : la police choisie (ou chargée) pour un nom d'origine est réutilisée automatiquement ensuite.
// Les fichiers de police sont rangés dans IndexedDB (localStorage est limité à ~5 Mo, soit 2 polices).
function normName(n){const t=(n||'').replace(/^[A-Z]{6}\+/,'').toLowerCase();return(!t||/^g_d\d/.test(t))?null:t}

const fontMem=new Map();

function idbPut(k,v){idb.then(db=>{if(!db)return;const st=db.transaction('fonts','readwrite').objectStore('fonts');v?st.put(v,k):st.delete(k)}).catch(()=>{})}

function dropFont(k){if(fontMem.has(k)){fontMem.delete(k);idbPut(k,null)}}
(async()=>{
  const db=await idb;
  if(db)await new Promise(res=>{try{const rq=db.transaction('fonts').objectStore('fonts').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){fontMem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}});
  try{   // reprise des polices enregistrées par les anciennes versions
    for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);
      if(key&&key.startsWith('cf:')){const k=key.slice(3);if(!fontMem.has(k))storeFont(k,b64ToBytes(localStorage.getItem(key)));localStorage.removeItem(key)}}
  }catch(e){}
})();
function saveChoice(fk,k){
  if(!k)return;
  try{
    if(fk==='custom'&&customFont){storeFont(k,customFont.bytes);localStorage.removeItem('fk:'+k)}
    else if(fk!=='custom'){localStorage.setItem('fk:'+k,fk);dropFont(k)}
  }catch(e){}
}
function autoPick(){
  if(!sel)return;

    const k=normName(sel.real);if(!k)return;
    const cf=fontMem.get(k);
    if(cf){

      o.textContent='Police enregistrée pour '+sel.real;$('fnt').value='custom';return;
    }

// Les textes ajoutés restent des objets (déplaçables, modifiables) tant qu'ils ne sont pas téléchargés ;
// le PDF affiché = PDF de base + ces objets dessinés dessus.
async function drawObjs(pdf,list){
  const cache=new Map();
  for(const o of list){
    const pg=pdf.getPages()[o.page];if(!pg)continue;
    if(o.type==='img'){
      const key='i'+o.id+(o.nb?'n':'');let emb=cache.get(key);
      if(!emb){emb=await pdf.embedPng(o.nb&&o.bytesNB?o.bytesNB:o.bytes);cache.set(key,emb)}
      pg.drawImage(emb,{x:o.x,y:o.y,width:o.w,height:o.h});continue;
    }
    const key=o.fontBytes?'b'+o.fsel+o.fontBytes.length:o.fk;
    let font=cache.get(key);
    if(!font){
      if(o.fontBytes){pdf.registerFontkit(fontkit);font=await pdf.embedFont(o.fontBytes,{subset:true})}
      else font=await pdf.embedFont(PDFLib.StandardFonts[o.fk]);
      cache.set(key,font);
    }
    pg.drawText(o.text,{x:o.x,y:o.y,size:o.size,font,color:PDFLib.rgb(o.color[0]/255,o.color[1]/255,o.color[2]/255)});
    o.w=font.widthOfTextAtSize(o.text,o.size);
  }
}
async function bake(b,list){   // PDF final : page de base + éléments dessinés dessus
  if(!list.length)return b;
  const pdf=await PDFLib.PDFDocument.load(b,{ignoreEncryption:true});
  await drawObjs(pdf,list);
  gc(pdf);
  return await pdf.save();
}
async function objsPdf(b,list){   // calque transparent : mêmes pages, seulement les éléments ajoutés
  const bd=await PDFLib.PDFDocument.load(b,{ignoreEncryption:true}),nd=await PDFLib.PDFDocument.create();
  bd.getPages().forEach(p=>{
    const mb=p.getMediaBox(),cb=p.getCropBox(),q=nd.addPage([mb.width,mb.height]);
    q.setMediaBox(mb.x,mb.y,mb.width,mb.height);q.setCropBox(cb.x,cb.y,cb.width,cb.height);
    const r=p.getRotation().angle;if(r)q.setRotation(PDFLib.degrees(r));
  });
  await drawObjs(nd,list);
  return await nd.save();
}
async function commit(nb,no){
  const op=no.length?await objsPdf(nb,no):null;   // peut échouer (caractère non pris en charge) avant de toucher à l'état
  history.push({base,objs});if(history.length>MAX_HISTORY)history.shift();redo=[];
  base=nb;objs=no;
  await refresh(true,op);
}
async function mutate(fn,remap){
  const pdf=await PDFLib.PDFDocument.load(base,{ignoreEncryption:true});
  await fn(pdf);
  gc(pdf);
  const nb=await pdf.save();
  await commit(nb,remap?remap(objs):objs);
}
async function applyObject(text,size,color,fk,realKey){
  const old=sel.objId,b0={x:sel.x,y:sel.y,real:sel.real,web:sel.web,bold:sel.bold,ital:sel.ital,fontLabel:sel.fontLabel,std:sel.key||'Helvetica'};
  if(!text.trim()){if(old)await commit(base,objs.filter(q=>q.id!==old));else closePanel();return}

async function removeBg(bytes){   // rend transparent le fond d'une zone copiée (papier, couleur unie)
  const bmp=await createImageBitmap(new Blob([bytes],{type:'image/png'})),c=document.createElement('canvas');
  c.width=bmp.width;c.height=bmp.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data,W=c.width,H=c.height,ring=[];
  for(let i=0;i<W*H;i++){const px=i%W,py=(i/W)|0;if((px<2||py<2||px>=W-2||py>=H-2)&&d[i*4+3]>200)ring.push(i)}
  if(ring.length<8)return bytes;
  const med=ch=>{const a=ring.map(i=>d[i*4+ch]).sort((p,q)=>p-q);return a[a.length>>1]};
  const bg=[med(0),med(1),med(2)];
  for(let i=0;i<W*H;i++){
    if(d[i*4+3]===0)continue;
    const dist=Math.hypot(d[i*4]-bg[0],d[i*4+1]-bg[1],d[i*4+2]-bg[2]),a=Math.min(1,Math.max(0,(dist-14)/34));
    if(a<.04){d[i*4+3]=0;continue}
    const kk=Math.max(a,.2);
    for(let ch=0;ch<3;ch++)d[i*4+ch]=Math.max(0,Math.min(255,bg[ch]+(d[i*4+ch]-bg[ch])/kk));
    d[i*4+3]=Math.round(d[i*4+3]*a);
  }
  x.putImageData(im,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

async function apply(){

  busy=true;
  const realKey=normName(sel.real);
  const text=$('txt').value,size=parseFloat($('sz').value)||sel.size,color=unhex($('col').value),fk=$('fnt').value;
  if(sel.add){
    try{await applyObject(text,size,color,fk,realKey)}
    catch(e){console.error(e);toast(/WinAnsi|encode/i.test(String(e.message))?'Un caractère n’est pas pris en charge par cette police : chargez « Mes polices ».':'Modification impossible : '+(e.message||e))}
    busy=false;return;
  }
  try{
    let tooLong=false;
    await mutate(async pdf=>{
      const page=pdf.getPages()[pageNo-1];
      let font;
      if(fk==='custom'){pdf.registerFontkit(fontkit);font=await pdf.embedFont(customFont.bytes,{subset:true})}
      else if(fk.startsWith('loc:')){
        const lb=await localFontBytes(fk.slice(4));
        if(lb){pdf.registerFontkit(fontkit);font=await pdf.embedFont(lb,{subset:true})}
        else{toast('Police intégrée introuvable : police proche utilisée.');font=await pdf.embedFont(PDFLib.StandardFonts[sel.key])}
      }
      else if(fk==='web'||fk.startsWith('web:')){
        const wb=await webFontBytes(fk==='web'?sel.web:{id:fk.slice(4)},sel.bold,sel.ital);
        if(wb){pdf.registerFontkit(fontkit);font=await pdf.embedFont(wb,{subset:true})}
        else{toast('Police exacte indisponible (connexion ?) : police proche utilisée.');font=await pdf.embedFont(PDFLib.StandardFonts[sel.key])}
      }else font=await pdf.embedFont(PDFLib.StandardFonts[fk]);
      const c=a=>PDFLib.rgb(a[0]/255,a[1]/255,a[2]/255),g=sel.group;
      // l'ancien texte est retiré du fichier (pas seulement recouvert)

        try{await redactPage(pdf,page,(x,y)=>R.some(r=>x>=r[0]&&x<=r[1]&&y>=r[2]&&y<=r[3]),()=>false)}catch(e){console.error(e)}}

      if(!text.trim())return;
      const maxW=g.length===1?1e9:Math.max(...g.map(l=>l.w));
      const lead=g.length>1?g[0].y-g[1].y:size*1.2;

  busy=false;
}

async function processContent(pdf,src,res,ctm0,hit,imgHit,rep,depth){
  const ops=lexPdf(src);
  const fontRes=res&&res.lookup?res.lookup(N('Font')):null,xoRes=res&&res.lookup?res.lookup(N('XObject')):null;
  let gs={ctm:ctm0,Tc:0,Tw:0,Th:1,TL:0,font:null,Tfs:0,Ts:0},Tm=ID6,Tlm=ID6;
  const stack=[],edits=[],xoCur={},xoNew={};
  for(const o of ops){
    const a=o.args,nu=k=>a[k]&&a[k].t==='#'?a[k].v:0;
    switch(o.op){
      case'q':stack.push({...gs});break;
      case'Q':if(stack.length)gs=stack.pop();break;
      case'cm':gs.ctm=mul([nu(0),nu(1),nu(2),nu(3),nu(4),nu(5)],gs.ctm);break;
      case'BT':Tm=Tlm=ID6;break;
      case'Tc':gs.Tc=nu(0);break;case'Tw':gs.Tw=nu(0);break;case'Tz':gs.Th=nu(0)/100;break;case'TL':gs.TL=nu(0);break;case'Ts':gs.Ts=nu(0);break;
      case'Tf':gs.font=a[0]&&a[0].t==='n'?await getFont(fontRes,a[0].v):null;gs.Tfs=nu(1);break;
      case'Td':Tlm=mul([1,0,0,1,nu(0),nu(1)],Tlm);Tm=Tlm;break;
      case'TD':gs.TL=-nu(1);Tlm=mul([1,0,0,1,nu(0),nu(1)],Tlm);Tm=Tlm;break;
      case'Tm':Tlm=Tm=[nu(0),nu(1),nu(2),nu(3),nu(4),nu(5)];break;
      case'T*':Tlm=mul([1,0,0,1,0,-gs.TL],Tlm);Tm=Tlm;break;
      case"'":case'"':case'Tj':case'TJ':{
        let pre='';
        if(o.op==='"'){gs.Tw=nu(0);gs.Tc=nu(1);pre=fmt(nu(0))+' Tw '+fmt(nu(1))+' Tc '}
        if(o.op==="'"||o.op==='"'){Tlm=mul([1,0,0,1,0,-gs.TL],Tlm);Tm=Tlm;pre+='T* '}
        const items=o.op==='TJ'?(a[0]&&a[0].t==='a'?a[0].v:[]):[a[a.length-1]||{t:'s',v:''}];
        const f=gs.font,sc=gs.Tfs*gs.Th,tk=[];let removed=0;
        const pS=b=>{const l=tk[tk.length-1];if(l&&l.s!=null)l.s+=b;else tk.push({s:b})};
        const pN=v=>{const l=tk[tk.length-1];if(l&&l.n!=null)l.n+=v;else tk.push({n:v})};
        for(const it of items){
          if(it.t==='#'){Tm=mul([1,0,0,1,-it.v/1000*sc,0],Tm);pN(it.v);continue}
          if(it.t!=='s')continue;
          const str=it.v,two=!!(f&&f.two);
          for(let k=0;k<str.length;k+=two?2:1){
            const code=two?(str.charCodeAt(k)<<8)|(str.charCodeAt(k+1)||0):str.charCodeAt(k),bytes=two?str.substr(k,2):str[k];
            const w0=f?f.w(code):.5,tx=(w0*gs.Tfs+gs.Tc+(!two&&code===32?gs.Tw:0))*gs.Th;
            let del=false;
            if(f&&sc){
              const T=mul([sc,0,0,gs.Tfs,0,gs.Ts],mul(Tm,gs.ctm)),wu=Math.max(w0,.05);
              if(hit.glyph)del=hit.glyph(T,wu);   // gomme / sélection : selon l'encre réellement effacée
              else if(hit(...ap(T,wu*.5,.3)))del=true;
              else{let c=0;for(const u of[.2,.5,.8])for(const v of[.05,.3,.55])if(hit(...ap(T,wu*u,v)))c++;del=c>=5}
            }
            if(del){pN(-tx/sc*1000);removed++}else pS(bytes);
            Tm=mul([1,0,0,1,tx,0],Tm);

        }
        if(removed){rep.removed+=removed;edits.push({s:o.s,e:o.e,txt:pre+'['+tk.map(t=>t.s!=null?'<'+hexOf(t.s)+'>':fmt(t.n)).join(' ')+'] TJ'})}
        break}
      case'BI':if(imgHit(gs.ctm))rep.img=true;break;
      case'Do':{

        const stn=pnm(cur.s.dict.lookup(N('Subtype')));
        if(stn==='/Image'){if(imgHit(gs.ctm))rep.img=true;break}
        if(stn!=='/Form'||depth>6)break;
        const mx=cur.s.dict.lookup(N('Matrix'));let M=ID6;
        if(mx&&mx.size&&mx.size()===6){M=[];for(let j=0;j<6;j++)M.push(pnv(mx.lookup(j)))}
        const fres=cur.s.dict.lookup(N('Resources'))||res;
        const bytes=cur.bytes!=null?cur.bytes:u8s(streamBytes(cur.s));
        const sub=await processContent(pdf,bytes,fres,mul(M,gs.ctm),hit,imgHit,rep,depth+1);
        if(sub.out!==null||sub.res){   // formulaire modifié : copie propre à cette page
          const nb=sub.out!==null?sub.out:bytes,ns=pdf.context.flateStream(su8(nb)),skip=SKIPK();
          for(const[k,v]of cur.s.dict.entries())if(!skip.has(k))ns.dict.set(k,v);
          if(sub.res)ns.dict.set(N('Resources'),sub.res);
          xoNew[name]=pdf.context.register(ns);xoCur[name]={s:ns,bytes:nb};
        }
        break}
    }
  }
  let out=null;
  if(edits.length){out='';let p=0;for(const ed of edits){out+=src.slice(p,ed.s)+' '+ed.txt+' ';p=ed.e}out+=src.slice(p)}
  let nres=null;
  if(Object.keys(xoNew).length){nres=res.clone(pdf.context);const xo=xoRes.clone(pdf.context);for(const k in xoNew)xo.set(N(k),xoNew[k]);nres.set(N('XObject'),xo)}
  return{out,res:nres};
}
async function redactPage(pdf,pg,hit,imgHit){
  const rep={removed:0,img:false},raw=pg.node.lookup(N('Contents'));
  if(!raw)return rep;
  const streams=[];
  if(raw instanceof PDFLib.PDFArray){for(let i=0;i<raw.size();i++){const s=raw.lookup(i);if(s instanceof PDFLib.PDFStream)streams.push(s)}}
  else if(raw instanceof PDFLib.PDFStream)streams.push(raw);
  const src=streams.map(s=>u8s(streamBytes(s))).join('\n');
  const r=await processContent(pdf,src,pg.node.Resources(),ID6,hit,imgHit,rep,0);
  if(r.out!==null){const ref=pdf.context.register(pdf.context.flateStream(su8(r.out)));pg.node.set(N('Contents'),pdf.context.obj([ref]))}
  if(r.res)pg.node.set(N('Resources'),r.res);
  return rep;
}
// Retire du fichier les objets qui ne sont plus utilisés (sinon l'ancien texte resterait caché dedans).
function gc(pdf){
  const c=pdf.context,ti=c.trailerInfo;if(!ti||!ti.Root)return;
  const seen=new Set(),st=[ti.Root,ti.Info,ti.Encrypt,ti.ID];
  while(st.length){
    const o=st.pop();if(!o)continue;
    if(o instanceof PDFLib.PDFRef){if(seen.has(o.tag))continue;seen.add(o.tag);st.push(c.lookup(o));continue}
    if(o instanceof PDFLib.PDFDict){for(const[,v]of o.entries())st.push(v)}
    else if(o instanceof PDFLib.PDFArray){for(let i=0;i<o.size();i++)st.push(o.get(i))}
    else if(o instanceof PDFLib.PDFStream)st.push(o.dict);
  }
  for(const[ref]of c.enumerateIndirectObjects())if(!seen.has(ref.tag))c.delete(ref);
}
// Vérification indépendante (lecture par pdf.js) : reste-t-il une lettre sous la zone ?
async function leftoverText(nb,pi,hit){
  const d=await pdfjsLib.getDocument({data:nb.slice()}).promise;
  try{
    const tc=await (await d.getPage(pi+1)).getTextContent();
    for(const it of tc.items){
      const s=it.str||'';if(!s.trim()||!it.width)continue;
      const t=it.transform,na=Math.hypot(t[0],t[1])||1,nb2=Math.hypot(t[2],t[3])||1,sz=nb2;
      const dx=t[0]/na,dy=t[1]/na,px=t[2]/nb2,py=t[3]/nb2,cw=it.width/s.length;
      for(let k=0;k<s.length;k++){
        if(!s[k].trim())continue;
        const c=(k+.5)*cw;
        if(hit.cell){   // même règle que la suppression : l'essentiel de l'encre de ce caractère a été effacé
          const u0=k*cw,u1=(k+1)*cw,pt=(u,v)=>[t[4]+dx*u+px*v*sz,t[5]+dy*u+py*v*sz];
          if(hit.cell([pt(u0,-.2),pt(u1,-.2),pt(u0,.8),pt(u1,.8)])>=.5)return true;
        }else if([c-cw*.35,c,c+cw*.35].every(u=>hit(t[4]+dx*u+px*.3*sz,t[5]+dy*u+py*.3*sz)))return true;
      }
    }
    return false;
  }finally{d.destroy()}
}
// Dernier recours : la page devient une image (rien de caché ne peut plus y subsister).
async function flattenPage(nb,pi){
  const d=await pdfjsLib.getDocument({data:nb.slice()}).promise;let jpg;
  try{
    const p=await d.getPage(pi+1),v1=p.getViewport({scale:1,rotation:0}),s=Math.min(3,2400/Math.max(v1.width,v1.height)),v=p.getViewport({scale:s,rotation:0});
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:x,viewport:v,annotationMode:pdfjsLib.AnnotationMode.DISABLE}).promise;
    jpg=new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',.92))).arrayBuffer());
  }finally{d.destroy()}
  const pdf=await PDFLib.PDFDocument.load(nb,{ignoreEncryption:true}),pg=pdf.getPages()[pi],cb=pg.getCropBox();
  pg.node.set(N('Contents'),pdf.context.obj([]));pg.node.set(N('Resources'),pdf.context.obj({}));
  pg.drawImage(await pdf.embedJpg(jpg),{x:cb.x,y:cb.y,width:cb.width,height:cb.height});
  gc(pdf);return await pdf.save();
}
// Plusieurs enregistrements internes → une seule étape à annuler
function squashTo(b0,o0){

  $('undo').disabled=history.length===0;

// On détache uniquement l'élément (lettres, trait) : le fond reste en place, l'élément devient déplaçable.
async function moveSel(){
  const W=cv.width,H=cv.height,kd=cv.width/curVp.width;
  let reg,bb,isMag=!!msel;
  if(msel){reg=msel.allow;bb=msel.bb}else if(zone){const z=zinfo||(zinfo=polyMask(zone));reg=z.mk;bb=z.bb}else return;
  const b0=base,o0=objs,mask0=msel?msel.mask:null;
  bb=[Math.max(0,bb[0]-3),Math.max(0,bb[1]-3),Math.min(W-1,bb[2]+3),Math.min(H-1,bb[3]+3)];
  await flattenIfTouched(bb);   // les éléments ajoutés présents dans la zone partent avec la sélection
  // couleur du fond autour de la zone
  const e0=Math.max(0,bb[0]-8),e1=Math.max(0,bb[1]-8),e2=Math.min(W-1,bb[2]+8),e3=Math.min(H-1,bb[3]+8),ew=e2-e0+1,eh=e3-e1+1;
  const ed=ctx.getImageData(e0,e1,ew,eh).data,rs=[],gs=[],bs=[],ri=[],gi=[],bi=[];
  for(let y=0;y<eh;y++)for(let x=0;x<ew;x++){const p=(e1+y)*W+e0+x,i=(y*ew+x)*4;
    if(reg[p]){if((x+y)%2===0){ri.push(ed[i]);gi.push(ed[i+1]);bi.push(ed[i+2])}}else{rs.push(ed[i]);gs.push(ed[i+1]);bs.push(ed[i+2])}}
  const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]};
  const bg=rs.length>20?[med(rs),med(gs),med(bs)]:[med(ri),med(gi),med(bi)];
  // pixels de l'élément (différents du fond) dans la zone
  const fg=new Uint8Array(W*H);let f0=W,f1=H,f2=-1,f3=-1;
  for(let y=bb[1];y<=bb[3];y++)for(let x=bb[0];x<=bb[2];x++){const p=y*W+x;if(!reg[p])continue;
    let on;
    if(isMag)on=mask0[p];
    else{const i=((y-e1)*ew+(x-e0))*4;on=Math.hypot(ed[i]-bg[0],ed[i+1]-bg[1],ed[i+2]-bg[2])>40}

  const fb=[Math.max(0,f0-3),Math.max(0,f1-3),Math.min(W-1,f2+3),Math.min(H-1,f3+3)],fw=fb[2]-fb[0]+1,fh=fb[3]-fb[1]+1;
  const lf=new Uint8Array(fw*fh),lr=new Uint8Array(fw*fh);
  for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){const p=(fb[1]+y)*W+fb[0]+x;lf[y*fw+x]=fg[p];lr[y*fw+x]=reg[p]}
  const clip=dilate(lf,fw,fh,2);for(let i=0;i<fw*fh;i++)if(!lr[i])clip[i]=0;
  // rendu haute définition de la zone (~290 dpi) pour que le texte déplacé reste net
  const page=await doc.getPage(pageNo),f=Math.min(6,Math.max(1,4/(kd*scale)));
  const vp2=page.getViewport({scale:scale*kd*f}),hw=Math.ceil(fw*f),hh=Math.ceil(fh*f);

  const im=hx.getImageData(0,0,hw,hh),d=im.data;

// Copier / couper une zone délimitée avec le contour, puis la coller ailleurs (même page, autre page, autre PDF)

  let x0=W,y0=H,x1=0,y1=0;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(W,Math.ceil(x1));y1=Math.min(H,Math.ceil(y1));

function finishBox(P){

  if(Math.hypot(b[0]-a[0],b[1]-a[1])<8){

    pcx.clearRect(0,0,pc.width,pc.height);

}

function showContour(S){

    const a=P[0],b=P[P.length-1];
    if(Math.hypot(b[0]-a[0],b[1]-a[1])<12){hideC();toast('Faites glisser pour tracer la forme.');return}

function polyMask(S){

  let x0=W,y0=H,x1=0,y1=0;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(W-1,Math.ceil(x1));y1=Math.min(H-1,Math.ceil(y1));
  const w=x1-x0+1,h=y1-y0+1,t=document.createElement('canvas');t.width=w;t.height=h;
  const c=t.getContext('2d');c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0]-x0,p[1]-y0):c.moveTo(p[0]-x0,p[1]-y0));c.closePath();c.fillStyle='#000';c.fill();

async function eraseContour(P){const{mk,bb}=polyMask(P);await eraseMagic(mk,bb)}

// ----- Sélection active (contour et/ou baguette magique) : la gomme n'efface que ce qui s'y trouve -----
let zone=null,zinfo=null,msel=null,zmeta=null;
function clearSel(){zone=null;zinfo=null;msel=null;zmeta=null;drawZone()}
function drawZone(){
  const c=$('zc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  if(msel&&msel.tint)x.drawImage(msel.tint,0,0,c.width,c.height);
  if(zone){
    x.save();x.setLineDash([8,5]);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#2447f9';x.lineWidth=2;
    x.beginPath();zone.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();x.restore();
  }
  $('zbar').hidden=!(zone||msel);
}
function allowMask(){
  if(msel)return msel.allow;
  if(zone){if(!zinfo)zinfo=polyMask(zone);return zinfo.mk}
  return null;
}
// La gomme est limitée à la sélection : on ne garde du geste que ce qui est dans la zone autorisée.
async function eraseSel(m,b){
  const al=allowMask();
  if(!al){await eraseMagic(m,b);return}
  const W=cv.width;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=b[1];y<=b[3];y++)for(let x=b[0];x<=b[2];x++){
    const i=y*W+x;
    if(m[i]&&al[i]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}else m[i]=0;
  }
  if(x1<0){pcx.clearRect(0,0,pc.width,pc.height);toast('Rien à effacer ici : le geste est en dehors de la sélection.');return}
  await eraseMagic(m,[x0,y0,x1,y1],al);
}
// Baguette magique : on touche un élément, on sélectionne ce qui lui ressemble (même couleur), sans les traits ni le fond.
function magicSelect(cx,cy){
  const W=cv.width,H=cv.height,k=cv.width/pc.width,R0=Math.max(6,Math.round(14*k));
  const sc=zone?(zinfo||(zinfo=polyMask(zone))):null;
  const d=ctx.getImageData(0,0,W,H).data;
  const wx0=Math.max(0,cx-R0*3),wy0=Math.max(0,cy-R0*3),wx1=Math.min(W-1,cx+R0*3),wy1=Math.min(H-1,cy+R0*3),rs=[],gs=[],bs=[];
  for(let y=wy0;y<=wy1;y+=2)for(let x=wx0;x<=wx1;x+=2){const i=(y*W+x)*4;rs.push(d[i]);gs.push(d[i+1]);bs.push(d[i+2])}

    if((x-cx)**2+(y-cy)**2>R0*R0)continue;
    const i=(y*W+x)*4,dd=(d[i]-bg[0])**2+(d[i+1]-bg[1])**2+(d[i+2]-bg[2])**2;
    if(dd>best){best=dd;ref=[d[i],d[i+1],d[i+2]]}

  let x0=W,y0=H,x1=-1,y1=-1;

    const p=y*W+x;if(sc&&!sc.mk[p])continue;
    const i=p*4,r=d[i],g=d[i+1],b=d[i+2],dr=(r-ref[0])**2+(g-ref[1])**2+(b-ref[2])**2;
    if(dr>=tol2)continue;

    for(let x=x0;x<=x1;x++){let s0=-1;for(let y=y0;y<=y1+1;y++){const on=y<=y1&&mk[y*W+x];if(on){if(s0<0)s0=y}else if(s0>=0){if(y-s0>=LV)for(let q=s0;q<y;q++)line[q*W+x]=1;s0=-1}}}

  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const p=(y0+j)*W+x0+i,q=j*w+i;
    if(cm[q]){mk[p]=1;n++}
    if(da[q]&&!dl[q]&&(!sc||sc.mk[p]))allow[p]=1;
  }
  return n?{mk,allow,bb:[x0,y0,x1,y1],n}:null;
}
function buildTint(){
  const W=cv.width,H=cv.height,t=document.createElement('canvas');t.width=W;t.height=H;
  const x=t.getContext('2d'),bb=msel.bb,w=bb[2]-bb[0]+1,h=bb[3]-bb[1]+1,im=x.createImageData(w,h),o=im.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(msel.mask[(bb[1]+j)*W+bb[0]+i]){const q=(j*w+i)*4;o[q]=236;o[q+1]=45;o[q+2]=155;o[q+3]=150}
  x.putImageData(im,bb[0],bb[1]);msel.tint=t;

function magicTap(P){
  const a=P[0],b=P[P.length-1];if(Math.hypot(b[0]-a[0],b[1]-a[1])>8)return;

    const k=cv.width/pc.width,r=magicSelect(Math.round(a[0]*k),Math.round(a[1]*k));

      const W=cv.width,o=msel,bb=[Math.min(o.bb[0],r.bb[0]),Math.min(o.bb[1],r.bb[1]),Math.max(o.bb[2],r.bb[2]),Math.max(o.bb[3],r.bb[3])];
      for(let y=r.bb[1];y<=r.bb[3];y++)for(let x=r.bb[0];x<=r.bb[2];x++){const i=y*W+x;if(r.mk[i])o.mask[i]=1;if(r.allow[i])o.allow[i]=1}
      o.bb=bb;

// ----- Outil Mots : on touche une lettre, il sélectionne les lettres et chiffres voisins, sans les points ni les traits -----
function inkMask(d,n,ref,bg,tol2){   // pixels d'encre : proches de la couleur touchée, plus proches d'elle que du fond
  const m=new Uint8Array(n);
  for(let p=0;p<n;p++){const i=p*4,r=d[i],g=d[i+1],b=d[i+2],dr=(r-ref[0])**2+(g-ref[1])**2+(b-ref[2])**2;
    if(dr<tol2&&dr<(r-bg[0])**2+(g-bg[1])**2+(b-bg[2])**2)m[p]=1}
  return m;
}
function labelComps(m,w,h){   // composantes connexes (8 voisins) : une lettre, un point, un trait…
  const lab=new Int32Array(w*h),comps=[],st=[];
  for(let s=0;s<w*h;s++){
    if(!m[s]||lab[s])continue;
    const id=comps.length+1,c={id,x0:w,y0:h,x1:-1,y1:-1,n:0};lab[s]=id;st.push(s);
    while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;c.n++;
      if(x<c.x0)c.x0=x;if(x>c.x1)c.x1=x;if(y<c.y0)c.y0=y;if(y>c.y1)c.y1=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const q=ny*w+nx;if(m[q]&&!lab[q]){lab[q]=id;st.push(q)}}}
    c.w=c.x1-c.x0+1;c.h=c.y1-c.y0+1;comps.push(c);
  }
  return{lab,comps};
}
function wordSelect(cx,cy,scope){

  const S=Math.round(Math.max(R0*6,Math.min(W,H)*.06)),qx0=Math.max(0,cx-S),qy0=Math.max(0,cy-S),qw=Math.min(W-1,cx+S)-qx0+1,qh=Math.min(H-1,cy+S)-qy0+1;

  const yA=Math.max(0,Math.round(base-.9*Hm)),yB=Math.min(bh-1,Math.max(yA,Math.round(base-1))),byId=new Map(letters.map(c=>[c.id,c]));
  for(const c of letters){c.cx0=Infinity;c.cx1=-1}
  for(let y=yA;y<=yB;y++)for(let x=0;x<bw;x++){const id=lab[y*bw+x];if(!id)continue;const c=byId.get(id);if(!c)continue;if(x<c.cx0)c.cx0=x;if(x>c.cx1)c.cx1=x}
  for(const c of letters)if(c.cx1<0){c.cx0=c.x0;c.cx1=c.x1}
  // seuil d'espace entre mots, adapté à la police : nettement plus grand que l'écart habituel entre deux lettres
  const lg=[];for(let i=1;i<letters.length;i++){const g=letters[i].cx0-letters[i-1].cx1;if(g>0&&g<Hm)lg.push(g)}
  const gmed=lg.length?med(lg):.3*Hm;
  const gapMax=scope==='phrase'?1.6*Hm:Math.min(.9*Hm,Math.max(.45*Hm,gmed*1.6));
  const leader=(a,b)=>smalls.filter(c=>c.x0>=a&&c.x1<=b&&c.y1>=base-.35*Hm).length>=2;
  let si=letters.indexOf(seed);if(si<0){letters.push(seed);letters.sort((a,b)=>a.x0-b.x0);si=letters.indexOf(seed)}
  const keep=new Set([seed]);let r=seed.cx1,l=seed.cx0;
  // plus grand blanc entre a et b, en comptant la ponctuation intermédiaire comme un appui (« 3.14 » reste un seul mot)
  const gapBetween=(a,b)=>{let prev=a,g=0;for(const c of smalls.filter(c=>c.x0>=a&&c.x1<=b).sort((p,q)=>p.x0-q.x0)){g=Math.max(g,c.x0-prev);prev=Math.max(prev,c.x1)}return Math.max(g,b-prev)};
  for(let i=si+1;i<letters.length;i++){const c=letters[i];if(c.cx1<=r){keep.add(c);continue}
    if(gapBetween(r,c.cx0)>gapMax||leader(r,c.cx0))break;keep.add(c);r=Math.max(r,c.cx1)}
  for(let i=si-1;i>=0;i--){const c=letters[i];if(c.cx0>=l){keep.add(c);continue}
    if(gapBetween(c.cx1,l)>gapMax||leader(c.cx1,l))break;keep.add(c);l=Math.min(l,c.cx0)}
  // accents, points des i et apostrophes : petits éléments au-dessus d'une lettre gardée
  for(const c of smalls){
    if(kind(c)==='line'||c.y1>base-.45*Hm)continue;
    const mx=(c.x0+c.x1)/2;
    for(const t of keep)if(mx>=t.x0-.25*Hm&&mx<=t.x1+.25*Hm){keep.add(c);break}
  }
  // 6. masques : pixels sélectionnés, et zone autorisée pour la gomme (jamais sur les points ni les traits ignorés)
  const ids=new Set([...keep].map(c=>c.id)),sel=new Uint8Array(bw*bh),ign=new Uint8Array(bw*bh);
  for(let i=0;i<bw*bh;i++){if(lab[i]&&ids.has(lab[i]))sel[i]=1;else if(m[i])ign[i]=1}
  const da=dilate(sel,bw,bh,2),di=dilate(ign,bw,bh,1),mk=new Uint8Array(W*H),allow=new Uint8Array(W*H);
  let x0=W,y0=H,x1=-1,y1=-1,n=0;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const q=y*bw+x,p=(by0+y)*W+bx0+x;
    if(sel[q]){mk[p]=1;n++;if(bx0+x<x0)x0=bx0+x;if(bx0+x>x1)x1=bx0+x;if(by0+y<y0)y0=by0+y;if(by0+y>y1)y1=by0+y}
    if(da[q]&&!di[q]&&(!sc||sc.mk[p]))allow[p]=1;
  }
  if(!n)return{err:'Aucune lettre trouvée ici.'};
  return{mk,allow,bb:[Math.max(0,x0-2),Math.max(0,y0-2),Math.min(W-1,x1+2),Math.min(H-1,y1+2)],n,count:keep.size};
}
function wordTap(P){
  const a=P[0],b=P[P.length-1];if(Math.hypot(b[0]-a[0],b[1]-a[1])>8)return;
  run(async()=>{
    const k=cv.width/pc.width,r=wordSelect(Math.round(a[0]*k),Math.round(a[1]*k),$('wscope').value);
    if(r.err){toast(r.err);return}
    if(!msel){msel={mask:r.mk,allow:r.allow,bb:r.bb}}
    else{   // chaque appui s'ajoute à la sélection
      const W=cv.width,o=msel;
      for(let y=r.bb[1];y<=r.bb[3];y++)for(let x=r.bb[0];x<=r.bb[2];x++){const i=y*W+x;if(r.mk[i])o.mask[i]=1;if(r.allow[i])o.allow[i]=1}
      o.bb=[Math.min(o.bb[0],r.bb[0]),Math.min(o.bb[1],r.bb[1]),Math.max(o.bb[2],r.bb[2]),Math.max(o.bb[3],r.bb[3])];
    }
    zmeta={page:pageNo,scale};buildTint();drawZone();
    toast('Sélectionné, sans les points ni les traits. Touchez un autre mot pour l’ajouter, ou choisissez Déplacer / Effacer.');
  });
}
$('wsel').onclick=()=>setMode('word');

$('clean').onclick=()=>{hideI();closePanel();document.body.classList.add('clean')};$('cleanx').onclick=()=>document.body.classList.remove('clean');
$('openbig').onclick=()=>$('file').click();
// zoom au pincement
let pinch=null;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
document.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:dist(e),z:zoom,f:1};if(pts)cancelStroke()}},{passive:true});   // un pincement annule le trait en cours
document.addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;e.preventDefault();
  pinch.f=Math.max(.5/pinch.z,Math.min(3/pinch.z,dist(e)/pinch.d));
  const st=$('stage').style;st.transformOrigin='0 0';st.transform='scale('+pinch.f+')';
},{passive:false});
document.addEventListener('touchend',e=>{
  if(!pinch||e.touches.length>1)return;
  const z=pinch.z*pinch.f,moved=Math.abs(pinch.f-1)>.02;$('stage').style.transform='';pinch=null;
  if(moved)setZoom(z);
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

function resetState(){   // repart de zéro à l'ouverture d'un nouveau document
  history=[];redo=[];objs=[];clip=null;$('paste').disabled=true;
  pendingImg=null;pendingPaste=false;addMode=false;$('addt').classList.remove('main');
  if(mode)setMode(mode);
  hideI();hideC();clearSel();closePanel();
  noTextWarned=false;pageNo=1;pendingShare=null;
}
$('file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';   // permet de rouvrir le même fichier
  if(!f)return;
  run(async()=>{
    const u8=new Uint8Array(await f.arrayBuffer());
    try{const test=await pdfjsLib.getDocument({data:u8.slice()}).promise;test.destroy()}   // on vérifie AVANT de remplacer le document en cours
    catch(err){toast(err&&err.name==='PasswordException'?'Ce PDF est protégé par un mot de passe.':'Ce fichier n’est pas un PDF lisible.');return}
    resetState();
    base=u8;fileName=f.name.replace(/\.pdf$/i,'')||'document';
    await refresh();
  });
};
$('apply').onclick=apply;
$('cancel').onclick=closePanel;
$('txt').onkeydown=e=>{if(e.key==='Enter')apply()};
function setZoom(z){zoom=Math.max(.5,Math.min(3,z));$('zv').textContent=Math.round(zoom*100)+' %';if(doc)render()}
$('zin').onclick=()=>setZoom(zoom+.25);
$('zout').onclick=()=>setZoom(zoom-.25);
$('prev').onclick=()=>{if(busy||pageNo<=1)return;pageNo--;render()};
$('next').onclick=()=>{if(busy||!doc||pageNo>=doc.numPages)return;pageNo++;render()};
async function restore(st){base=st.base;objs=st.objs;await refresh(true)}
$('undo').onclick=()=>run(async()=>{if(history.length){redo.push({base,objs});await restore(history.pop())}});
$('redo').onclick=()=>run(async()=>{if(redo.length){history.push({base,objs});await restore(redo.pop())}});
// Téléchargement : sur iPhone/iPad (surtout en appli installée), on passe par la feuille de partage.
let pendingShare=null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function sharePdf(file){
  try{await navigator.share({files:[file]});pendingShare=null}
  catch(e){
    if(e.name==='AbortError'){pendingShare=null;return}
    if(e.name==='NotAllowedError'){toast('PDF prêt : touchez à nouveau le bouton Télécharger.');return}
    throw e;
  }
}
$('save').onclick=()=>{
  // fichier déjà préparé et document inchangé : on partage tout de suite (le navigateur exige un geste récent)
  if(pendingShare&&pendingShare.base===base&&pendingShare.objs===objs){sharePdf(pendingShare.file).catch(e=>toast('Partage impossible : '+(e.message||e)));return}
  run(async()=>{
    const out=await bake(base,objs),name=fileName+'-modifié.pdf',blob=new Blob([out],{type:'application/pdf'});
    if(isIOS&&navigator.canShare){
      const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){pendingShare={file,base,objs};await sharePdf(file);return}
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  });
};
// On ne re-rend que si la largeur change : l'ouverture du clavier (Android) ne doit plus fermer le panneau de texte.
let lastW=window.innerWidth;
window.addEventListener('resize',()=>{
  if(!doc||window.innerWidth===lastW)return;
  lastW=window.innerWidth;clearTimeout(window._r);window._r=setTimeout(render,250);
});
